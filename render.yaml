services:
  - type: web
    name: praxis-backend
    runtime: python
    plan: free
    buildCommand: "pip install -e '.[dev]'"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOWED_ORIGINS
        value: "https://praxis-frontend-r4tp.onrender.com,https://praxis-frontend.onrender.com,https://am-pop-frontend.onrender.com"
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DEMO_ACCOUNTS
        value: "true"
      - key: DEFAULT_TENANT_ID
        value: "00000000-0000-0000-0000-000000000001"
      - key: DEFAULT_WORKSPACE_NAME
        value: "Praxis Main Plant"
      - key: CLERK_PUBLISHABLE_KEY
        value: "pk_test_Y3Jpc3AtdHJvbGwtNDc5Ni5jbGVyay5hY2NvdW50cy5kZXYk"
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false

  - type: web
    name: praxis-frontend
    runtime: static
    # NOTE: VITE_* environment variables are baked into JavaScript bundles at build time.
    # If you change VITE_API_BASE_URL or VITE_CLERK_PUBLISHABLE_KEY in Render, you must
    # trigger "Manual Deploy > Clear build cache & deploy" to rebuild the frontend assets.
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: "frontend/dist"
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        value: "pk_test_Y3Jpc3AtdHJvbGwtNDc5Ni5jbGVyay5hY2NvdW50cy5kZXYk"
      - key: VITE_API_BASE_URL
        value: "https://praxis-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
