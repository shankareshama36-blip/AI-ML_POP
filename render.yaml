services:
  - type: web
    name: am-pop-backend
    runtime: python
    plan: free
    buildCommand: "pip install -e '.[dev]'"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOWED_ORIGINS
        value: "https://am-pop-frontend.onrender.com"

  - type: web
    name: am-pop-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
