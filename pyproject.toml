[project]
name = "am-pop"
version = "0.1.0"
description = "AM&POP backend foundation"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I"]
